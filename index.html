<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Crop Daddy</title>

<!-- Home screen app settings (iPhone and Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crop Daddy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ee">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
  html, body { margin: 0; height: 100%; background: #f6f4ee; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- The app itself runs from Google Apps Script (the Hardwick Tap Page script on the Tap Log sheet).
     If that web app link ever changes, update APP_URL below. -->
<iframe id="app" title="Crop Daddy" allow="clipboard-write"></iframe>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyhbH2AwWCpkWHIf7NfGR02XSlrJNmjWSVm-ipoxRaH2aJqxY1fcZW3FmBVhF3aBTlN/exec';
  // Pass anything after "?" through, so app.hardwickornamentals.co.nz/?log=Spray Log opens that log directly
  document.getElementById('app').src = APP_URL + location.search;
</script>
<script>
  // Keeps the app's remembered settings (passcode, who's logging) on this site,
  // because iPhones keep clearing what the Google frame stores. Only Google's app frame can read or change them.
  (function () {
    var PREFIX = 'cd_';
    function fromGoogle(origin) { try { return /\.googleusercontent\.com$/.test(new URL(origin).hostname); } catch (e) { return false; } }
    window.addEventListener('message', function (e) {
      if (!fromGoogle(e.origin)) return;
      var d = e.data || {};
      if (d.cd === 'getAll') {
        var vals = {};
        try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(PREFIX) === 0) vals[k.slice(PREFIX.length)] = localStorage.getItem(k); } } catch (x) {}
        e.source.postMessage({ cd: 'all', vals: vals }, e.origin);
      } else if (d.cd === 'save' && typeof d.k === 'string') {
        try { if (d.v) localStorage.setItem(PREFIX + d.k, String(d.v)); else localStorage.removeItem(PREFIX + d.k); } catch (x) {}
      }
    });
  })();
</script>
</body>
</html>
